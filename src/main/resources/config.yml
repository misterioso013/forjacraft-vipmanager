# ForjaCraft VIP Manager
# Tiers, ordered from lowest to highest rank. Order matters: it decides which
# owned tier becomes active when the current active tier expires, and which
# tier "wins" if more than one LuckPerms tier group is ever found on a single
# player during join-time reconciliation (should not normally happen).
tiers:
  barao:
    luckPermsGroup: barao
    claimBlockBonus: 5000
    displayName: '&6Barão'
  marques:
    luckPermsGroup: marques
    claimBlockBonus: 8000
    displayName: '&fMarquês'
  duque:
    luckPermsGroup: duque
    claimBlockBonus: 12000
    displayName: '&dDuque'
  rei:
    luckPermsGroup: rei
    claimBlockBonus: 15000
    displayName: '&cRei'

storage:
  # sqlite (default): one local file, plugins/VipManager/vipmanager.db - fine as long
  # as this plugin only ever runs on a single backend server.
  # mysql: shared database, needed once the network splits into separate backend
  # hosts per map (e.g. lobby/world/recursos behind a proxy) so every host reads/
  # writes the SAME VIP balance/kit-claim state instead of each host having its own
  # isolated copy. See MysqlVipStorage's class docs for a caveat about LuckPerms
  # group sync across hosts - this setting alone does not solve that part.
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: vipmanager
    username: vipmanager
    password: ''

sweep:
  # How often the background task reconciles every player with an active tier
  # (checkpoints elapsed time, expires tiers that hit zero). Independent of
  # who is online - see the join listener for the online-specific path.
  interval-seconds: 60

switch:
  cooldown-seconds: 60

kits:
  # Command run (as the player) to open the DeluxeMenus VIP kit selection screen -
  # used both for "/vip kits" and to return the player there from the "Voltar"
  # button in the kit preview GUI. Matches kitsvip.yml's open_command in the
  # server-config repo.
  menu-open-command: 'dm open kitsvip'
  # Command run to open the general kits menu (novato/claim/fazendeiro/comida +
  # the VIP category) - used by "/kit" and "/kits" with no argument, and to
  # return the player there from a free kit's preview "Voltar" button. Matches
  # principal.yml's open_command in the server-config repo.
  general-menu-open-command: 'dm open kits'

# Placeholder used by %vipmanager_active_tier% (and friends) when a player
# owns no tier with time remaining.
no-tier-placeholder: 'none'

# /vipadmin migrate strips every configured tier's LuckPerms group from every
# player who has it (searched across LuckPerms' whole backing storage, not
# just online players) and does NOT grant any banked time - decided this way
# because the server had not launched yet, so every existing grant was test
# data. If a future migration ever needs to convert real paying holders'
# permanent grants into banked time instead of wiping them, that's a
# deliberate, separate decision to make before touching this command again.

messages:
  prefix: '&8[&bVIP&8] &r'
  no-tier-owned: '&cVocê não tem nenhum tier de VIP ativo.'
  not-owned: '&cVocê não possui o tier &f%tier%&c.'
  already-active: '&cO tier &f%tier% &cjá está ativo.'
  switch-success: '&aTier ativo trocado para &f%tier%&a.'
  switch-cooldown: '&cAguarde &f%seconds%s &cpara trocar de tier novamente.'
  expired: '&cSeu VIP &f%tier% &cexpirou.'
  expired-fallback: '&cSeu VIP &f%tier% &cexpirou. Ativado automaticamente: &f%fallback%&c.'
  kit-unknown: '&cKit desconhecido.'
  kit-tier-too-low: '&cVocê precisa estar com o tier &f%tier% &cativo pra resgatar esse kit (kits não acumulam entre tiers).'
  kit-on-cooldown: '&cVocê já resgatou esse kit. Espere mais &f%time%&c.'
  kit-no-space: '&cSeu inventário não tem espaço suficiente pra esse kit. Abra espaço e tente de novo.'
  kit-claimed: '&aKit resgatado com sucesso!'
  kit-already-claimed: '&cVocê já resgatou esse kit - ele só pode ser resgatado uma vez.'
